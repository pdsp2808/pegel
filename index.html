<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pegelstand-Dashboard Luxemburg</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 900: '#14532d' } } } }
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
    .sparkline-container { height: 50px; width: 130px; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Header & Navigation -->
  <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-blue-600 text-white rounded-lg shadow">
            <i data-lucide="waves" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold leading-none text-gray-900 dark:text-white">Pegelstand-Monitor</h1>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Quelle: inondations.lu</p>
          </div>
        </div>

        <nav class="hidden md:flex space-x-1 bg-gray-100 dark:bg-gray-900 p-1 rounded-lg border border-gray-200 dark:border-gray-800">
          <button id="nav-dashboard" onclick="switchTab('dashboard')" class="tab-btn px-4 py-1.5 rounded-md text-sm font-medium transition-all flex items-center space-x-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white shadow-sm">
            <i data-lucide="layout-grid" class="w-4 h-4"></i>
            <span>Dashboard</span>
          </button>
          <button id="nav-chart" onclick="switchTab('chart')" class="tab-btn px-4 py-1.5 rounded-md text-sm font-medium transition-all flex items-center space-x-2 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
            <i data-lucide="line-chart" class="w-4 h-4"></i>
            <span>Verlaufsdiagramm</span>
          </button>
          <button id="nav-all" onclick="switchTab('all')" class="tab-btn px-4 py-1.5 rounded-md text-sm font-medium transition-all flex items-center space-x-2 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
            <i data-lucide="list" class="w-4 h-4"></i>
            <span>Alle Pegel</span>
          </button>
        </nav>

        <div class="flex items-center space-x-2">
          <div class="hidden sm:flex flex-col text-right mr-2">
            <span class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Stand</span>
            <span id="last-update-time" class="text-xs font-mono font-medium text-gray-700 dark:text-gray-300">--:--:--</span>
          </div>

          <button onclick="fetchData()" title="Daten jetzt aktualisieren" class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">
            <i id="refresh-icon" data-lucide="refresh-cw" class="w-5 h-5"></i>
          </button>

          <button id="theme-toggle" onclick="toggleTheme()" title="Design umschalten" class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">
            <i id="theme-icon-sun" data-lucide="sun" class="w-5 h-5 hidden"></i>
            <i id="theme-icon-moon" data-lucide="moon" class="w-5 h-5"></i>
          </button>
        </div>

      </div>
    </div>

    <div class="flex md:hidden border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 px-2 py-1.5 justify-around">
      <button id="mobile-nav-dashboard" onclick="switchTab('dashboard')" class="mobile-tab-btn flex-1 py-1 text-xs font-medium text-center rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm">Dashboard</button>
      <button id="mobile-nav-chart" onclick="switchTab('chart')" class="mobile-tab-btn flex-1 py-1 text-xs font-medium text-center text-gray-500 dark:text-gray-400">Diagramm</button>
      <button id="mobile-nav-all" onclick="switchTab('all')" class="mobile-tab-btn flex-1 py-1 text-xs font-medium text-center text-gray-500 dark:text-gray-400">Alle Pegel</button>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

    <section id="tab-content-dashboard" class="space-y-6">
      <div>
        <h2 class="text-xl font-bold text-gray-900 dark:text-white">Haupt-Messstationen</h2>
        <p class="text-xs text-gray-500 dark:text-gray-400">Aktuelle Pegelstände und 12-Stunden-Trend</p>
      </div>
      <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4"></div>
    </section>

    <section id="tab-content-chart" class="hidden space-y-6">
      <div class="bg-white dark:bg-gray-800 rounded-xl p-4 sm:p-5 border border-gray-200 dark:border-gray-700 space-y-4 shadow-sm">
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
          <div>
            <h2 class="text-lg font-bold text-gray-900 dark:text-white">Interaktiver Pegelverlauf</h2>
            <p class="text-xs text-gray-500 dark:text-gray-400">Vergleich über verschiedene Zeiträume</p>
          </div>
          <div class="flex flex-wrap gap-1 bg-gray-100 dark:bg-gray-900 p-1 rounded-lg border border-gray-200 dark:border-gray-800">
            <button onclick="setTimeFilter(2)" class="time-filter-btn px-2.5 py-1 text-xs font-semibold rounded-md text-gray-600 dark:text-gray-400" data-hours="2">2h</button>
            <button onclick="setTimeFilter(4)" class="time-filter-btn px-2.5 py-1 text-xs font-semibold rounded-md text-gray-600 dark:text-gray-400" data-hours="4">4h</button>
            <button onclick="setTimeFilter(8)" class="time-filter-btn px-2.5 py-1 text-xs font-semibold rounded-md text-gray-600 dark:text-gray-400" data-hours="8">8h</button>
            <button onclick="setTimeFilter(12)" class="time-filter-btn px-2.5 py-1 text-xs font-semibold rounded-md text-gray-600 dark:text-gray-400" data-hours="12">12h</button>
            <button onclick="setTimeFilter(24)" class="time-filter-btn px-2.5 py-1 text-xs font-semibold rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-white shadow-sm" data-hours="24">24h</button>
            <button onclick="setTimeFilter(48)" class="time-filter-btn px-2.5 py-1 text-xs font-semibold rounded-md text-gray-600 dark:text-gray-400" data-hours="48">48h</button>
            <button onclick="setTimeFilter(72)" class="time-filter-btn px-2.5 py-1 text-xs font-semibold rounded-md text-gray-600 dark:text-gray-400" data-hours="72">72h</button>
            <button onclick="setTimeFilter(0)" class="time-filter-btn px-2.5 py-1 text-xs font-semibold rounded-md text-gray-600 dark:text-gray-400" data-hours="0">Alle</button>
          </div>
        </div>
        <div class="pt-3 border-t border-gray-100 dark:border-gray-700/50">
          <span class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider block mb-2">Stationen:</span>
          <div id="chart-stations-selector" class="flex flex-wrap gap-2"></div>
        </div>
      </div>
      <div class="bg-white dark:bg-gray-800 rounded-xl p-4 sm:p-5 border border-gray-200 dark:border-gray-700 shadow-sm relative min-h-[380px]">
        <canvas id="mainChart" class="w-full h-[400px]"></canvas>
      </div>
    </section>

    <section id="tab-content-all" class="hidden space-y-6">
      <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden">
        <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 class="text-lg font-bold text-gray-900 dark:text-white">Alle Messstationen</h2>
            <p class="text-xs text-gray-500 dark:text-gray-400">Vollständige Liste</p>
          </div>
          <div class="relative w-full sm:w-64">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="table-search-input" onkeyup="filterAllStationsTable()" placeholder="Suchen..." class="w-full pl-9 pr-4 py-1.5 text-xs rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none">
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-gray-50 dark:bg-gray-900/50 text-gray-500 dark:text-gray-400 uppercase font-semibold border-b border-gray-200 dark:border-gray-700">
              <tr>
                <th class="px-4 py-3">Station</th>
                <th class="px-4 py-3 text-right">Aktueller Pegel</th>
                <th class="px-4 py-3 text-center">Trend</th>
                <th class="px-4 py-3 text-right">Messung</th>
              </tr>
            </thead>
            <tbody id="all-stations-table-body" class="divide-y divide-gray-200 dark:divide-gray-700/50"></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <script>
    const PRIMARY_STATIONS = [
      { name: 'Diekirch', river: 'Sauer', search: 'diekirch' },
      { name: 'Vianden', river: 'Our', search: 'vianden' },
      { name: 'Bollendorf', river: 'Sauer', search: 'bollendorf' },
      { name: 'Larochette', river: 'Weiße Ernz', search: 'larochette' },
      { name: 'Reisdorf', river: 'Sauer', search: 'reisdorf' },
      { name: 'Lintgen', river: 'Alzette', search: 'lintgen' }
    ];

    let parsedData = {};
    let selectedHours = 24;
    let selectedChartStations = [];
    let mainChartInstance = null;
    let sparklineInstances = {};

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      lucide.createIcons();
      fetchData();
      setInterval(fetchData, 300000);
    });

    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon-sun').classList.remove('hidden');
        document.getElementById('theme-icon-moon').classList.add('hidden');
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-icon-sun').classList.toggle('hidden', !isDark);
      document.getElementById('theme-icon-moon').classList.toggle('hidden', isDark);
      if (mainChartInstance) renderMainChart();
      renderDashboard();
    }

    function switchTab(tabId) {
      document.getElementById('tab-content-dashboard').classList.toggle('hidden', tabId !== 'dashboard');
      document.getElementById('tab-content-chart').classList.toggle('hidden', tabId !== 'chart');
      document.getElementById('tab-content-all').classList.toggle('hidden', tabId !== 'all');

      document.querySelectorAll('.tab-btn').forEach(btn => btn.className = 'tab-btn px-4 py-1.5 rounded-md text-sm font-medium text-gray-600 dark:text-gray-400');
      const activeNav = document.getElementById(`nav-${tabId}`);
      if (activeNav) activeNav.className = 'tab-btn px-4 py-1.5 rounded-md text-sm font-medium bg-white dark:bg-gray-800 text-gray-900 dark:text-white shadow-sm';

      if (tabId === 'chart') setTimeout(() => renderMainChart(), 50);
    }

    async function fetchData() {
      const refreshIcon = document.getElementById('refresh-icon');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');

      try {
        const response = await fetch(`data.csv?t=${Date.now()}`);
        if (response.ok) {
          const csvText = await response.text();
          parseRobustCSV(csvText);
        }
      } catch (err) {
        console.error('Fehler beim Laden der CSV:', err);
      }

      document.getElementById('last-update-time').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (refreshIcon) setTimeout(() => refreshIcon.classList.remove('animate-spin'), 500);

      renderDashboard();
      initChartControls();
      renderMainChart();
      renderAllStationsTable();
    }

    function parseRobustCSV(csvText) {
      parsedData = {};
      const lines = csvText.split(/\r\n|\n/).filter(line => line.trim().length > 0);
      if (lines.length < 2) return;

      // Erkenne Trennzeichen (Semikolon oder Komma)
      const delimiter = lines[0].includes(';') ? ';' : ',';
      const headers = lines[0].split(delimiter).map(h => h.trim().replace(/^"|"$/g, ''));

      // Finde Spalten für Datum/Zeit
      let dateIdx = headers.findIndex(h => /date|time|datum|zeit/i.test(h));
      if (dateIdx === -1) dateIdx = 0;

      const stationMap = [];
      for (let i = 0; i < headers.length; i++) {
        if (i === dateIdx) continue;
        const name = headers[i];
        if (name) {
          stationMap.push({ colIdx: i, name: name, id: 'st_' + i });
          parsedData['st_' + i] = { name: name, points: [] };
        }
      }

      for (let r = 1; r < lines.length; r++) {
        const cols = lines[r].split(delimiter).map(c => c.trim().replace(/^"|"$/g, ''));
        const rawDate = cols[dateIdx];
        if (!rawDate) continue;

        // Erstelle Datumsobjekt universell
        let timeObj = new Date(rawDate);
        if (isNaN(timeObj.getTime()) && rawDate.includes('.')) {
          const parts = rawDate.split(' ');
          const dParts = parts[0].split('.');
          const tParts = parts[1] ? parts[1].split(':') : [0,0];
          timeObj = new Date(dParts[2], dParts[1] - 1, dParts[0], tParts[0], tParts[1]);
        }

        if (isNaN(timeObj.getTime())) continue;

        stationMap.forEach(st => {
          const valStr = cols[st.colIdx];
          if (valStr !== undefined && valStr !== '') {
            const val = parseFloat(valStr.replace(',', '.'));
            if (!isNaN(val)) {
              parsedData[st.id].points.push({ time: timeObj, value: val });
            }
          }
        });
      }

      // Sortieren
      Object.keys(parsedData).forEach(id => {
        parsedData[id].points.sort((a, b) => a.time - b.time);
      });

      // Vorauswahl für Chart treffen
      if (selectedChartStations.length === 0) {
        selectedChartStations = Object.keys(parsedData).slice(0, 4);
      }
    }

    function renderDashboard() {
      const grid = document.getElementById('dashboard-grid');
      grid.innerHTML = '';

      PRIMARY_STATIONS.forEach(st => {
        // Finde die passende Station aus den echten CSV-Daten
        const matchedKey = Object.keys(parsedData).find(k => 
          parsedData[k].name.toLowerCase().includes(st.search)
        );

        const series = matchedKey ? parsedData[matchedKey].points : [];
        const latest = series.length > 0 ? series[series.length - 1] : { value: '--', time: new Date() };
        
        let trendIcon = 'minus';
        let trendColor = 'text-gray-400';
        
        if (series.length >= 4) {
          const prev = series[series.length - 5] || series[0];
          const diff = latest.value - prev.value;
          if (diff > 1) { trendIcon = 'trending-up'; trendColor = 'text-red-500'; }
          else if (diff < -1) { trendIcon = 'trending-down'; trendColor = 'text-green-500'; }
        }

        const timeStr = latest.time instanceof Date ? latest.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--:--';

        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-gray-800 rounded-xl p-5 border border-gray-200 dark:border-gray-700 shadow-sm flex items-center justify-between';
        
        card.innerHTML = `
          <div class="space-y-1">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-semibold px-2 py-0.5 rounded bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300">${st.river}</span>
              <span class="text-xs text-gray-400 font-mono">${timeStr} Uhr</span>
            </div>
            <h3 class="text-lg font-bold text-gray-900 dark:text-white">${st.name}</h3>
            <div class="flex items-baseline space-x-2 pt-1">
              <span class="text-3xl font-extrabold text-gray-900 dark:text-white">${latest.value}</span>
              <span class="text-xs text-gray-500 dark:text-gray-400">cm</span>
              <div class="flex items-center text-xs font-bold ${trendColor} ml-2">
                <i data-lucide="${trendIcon}" class="w-4 h-4 mr-0.5"></i>
              </div>
            </div>
          </div>
          <div class="flex flex-col items-end">
            <span class="text-[10px] text-gray-400 font-semibold mb-1">12h-Verlauf</span>
            <div class="sparkline-container"><canvas id="sparkline-${st.search}"></canvas></div>
          </div>
        `;

        grid.appendChild(card);
        if (matchedKey) setTimeout(() => createSparkline(st.search, series), 20);
      });

      lucide.createIcons();
    }

    function createSparkline(key, series) {
      const ctx = document.getElementById(`sparkline-${key}`);
      if (!ctx) return;

      const twelveHoursAgo = new Date(Date.now() - 12 * 60 * 60 * 1000);
      const filtered = series.filter(d => d.time >= twelveHoursAgo);

      if (sparklineInstances[key]) sparklineInstances[key].destroy();

      sparklineInstances[key] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: filtered.map(d => d.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })),
          datasets: [{ data: filtered.map(d => d.value), borderColor: document.documentElement.classList.contains('dark') ? '#60a5fa' : '#2563eb', borderWidth: 2, pointRadius: 0, tension: 0.3 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
      });
    }

    function initChartControls() {
      const container = document.getElementById('chart-stations-selector');
      container.innerHTML = '';
      Object.keys(parsedData).forEach(id => {
        const name = parsedData[id].name;
        const isChecked = selectedChartStations.includes(id);

        const btn = document.createElement('label');
        btn.className = `cursor-pointer text-xs px-3 py-1.5 rounded-lg border flex items-center space-x-1.5 ${isChecked ? 'bg-blue-50 dark:bg-blue-900/30 border-blue-500 text-blue-700 dark:text-blue-300 font-semibold' : 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400'}`;
        btn.innerHTML = `<input type="checkbox" value="${id}" ${isChecked ? 'checked' : ''} onchange="toggleChartStation('${id}')" class="hidden"><span>${name}</span>`;
        container.appendChild(btn);
      });
    }

    function toggleChartStation(id) {
      selectedChartStations = selectedChartStations.includes(id) ? selectedChartStations.filter(k => k !== id) : [...selectedChartStations, id];
      initChartControls();
      renderMainChart();
    }

    function setTimeFilter(hours) {
      selectedHours = hours;
      renderMainChart();
    }

    function renderMainChart() {
      const ctx = document.getElementById('mainChart');
      if (!ctx) return;

      const isDark = document.documentElement.classList.contains('dark');
      const colors = ['#2563eb', '#dc2626', '#16a34a', '#d97706', '#9333ea', '#0891b2', '#e11d48'];
      const cutoff = selectedHours > 0 ? new Date(Date.now() - selectedHours * 60 * 60 * 1000) : null;

      const datasets = [];
      let labelTimestamps = [];

      selectedChartStations.forEach((id, idx) => {
        const st = parsedData[id];
        if (!st) return;
        const filtered = cutoff ? st.points.filter(d => d.time >= cutoff) : st.points;

        if (filtered.length > labelTimestamps.length) {
          labelTimestamps = filtered.map(d => d.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        }

        datasets.push({
          label: st.name,
          data: filtered.map(d => d.value),
          borderColor: colors[idx % colors.length],
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2
        });
      });

      if (mainChartInstance) mainChartInstance.destroy();

      mainChartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels: labelTimestamps, datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { ticks: { color: isDark ? '#9ca3af' : '#4b5563' } },
            y: { ticks: { color: isDark ? '#9ca3af' : '#4b5563' } }
          }
        }
      });
    }

    function renderAllStationsTable() {
      const tbody = document.getElementById('all-stations-table-body');
      if (!tbody) return;
      tbody.innerHTML = '';

      Object.keys(parsedData).forEach(id => {
        const st = parsedData[id];
        if (!st.points || st.points.length === 0) return;

        const latest = st.points[st.points.length - 1];
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-50 dark:hover:bg-gray-700/30';
        tr.innerHTML = `
          <td class="px-4 py-3 font-semibold text-gray-900 dark:text-white">${st.name}</td>
          <td class="px-4 py-3 font-bold text-right text-blue-600 dark:text-blue-400">${latest.value} cm</td>
          <td class="px-4 py-3 text-center text-gray-400">&bull;</td>
          <td class="px-4 py-3 text-right text-gray-500 font-mono">${latest.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterAllStationsTable() {
      const input = document.getElementById('table-search-input').value.toLowerCase();
      document.querySelectorAll('#all-stations-table-body tr').forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(input) ? '' : 'none';
      });
    }
  </script>
</body>
</html>
